# 🚀 n8n integrado com OpenWA existente
# Use: docker compose -f docker-compose.n8n.yml up -d

services:
  # ========================================
  # n8n (Workflow Automation)
  # ========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database - Usar PostgreSQL do OpenWA
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=openwa-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=openwa
      - DB_POSTGRESDB_PASSWORD=openwa

      # Queue Mode - Usar Redis do OpenWA
      - QUEUE_BULL_REDIS_HOST=openwa-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - EXECUTIONS_MODE=queue

      # Authentication - User Management habilitado para criar owner account no primeiro acesso
      - N8N_USER_MANAGEMENT_DISABLED=false

      # Segurança - Desabilitar secure cookie para HTTP local
      - N8N_SECURE_COOKIE=false

      # Rate Limiting - Desabilitar para desenvolvimento local
      - N8N_PUBLIC_API_RATE_LIMIT_ENABLED=false
      - N8N_LOGIN_RATE_LIMIT_ENABLED=false

      # Webhooks
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      # Timezone
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo

      # Executions
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 dias

      # Performance
      - N8N_PAYLOAD_SIZE_MAX=32
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*

      # Encryption
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-ca59bc02c280ccdb873958a42d2b97b3}

      # Community Nodes
      - N8N_COMMUNITY_PACKAGES_ENABLED=true

      # AI Assistant - Anthropic Proxy Local
      - N8N_AI_ANTHROPIC_BASE_URL=http://host.docker.internal:6656/anthropic

    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    networks:
      - openwa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # n8n Worker (opcional, para escalar)
  # ========================================
  n8n-worker:
    image: n8nio/n8n:latest
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=openwa-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=openwa
      - DB_POSTGRESDB_PASSWORD=openwa
      - QUEUE_BULL_REDIS_HOST=openwa-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - EXECUTIONS_MODE=queue
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-ca59bc02c280ccdb873958a42d2b97b3}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    depends_on:
      - n8n
    networks:
      - openwa-network

# ========================================
# Volumes
# ========================================
volumes:
  n8n_data:
    driver: local
  n8n_files:
    driver: local

# ========================================
# Networks - Usar rede existente do OpenWA
# ========================================
networks:
  openwa-network:
    external: true
