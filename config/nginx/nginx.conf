# ==============================================================================
# NGINX PRODUCTION CONFIG - AAA GRADE
# ==============================================================================
# Performance: p95 latency ≤900ms | Throughput: 1000 req/min baseline
# Security: Rate limiting + DDoS protection + Headers hardening
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================================================================
    # LOGGING FORMAT
    # ==============================================================================
    log_format main_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log main_json buffer=32k flush=5s;

    # ==============================================================================
    # PERFORMANCE TUNING
    # ==============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Client upload limits (WhatsApp media)
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # Proxy timeouts (LLM streaming needs longer)
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffers
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ==============================================================================
    # RATE LIMITING ZONES (DDoS Protection)
    # ==============================================================================
    # Zone 1: General API rate limiting (100 req/min per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Zone 2: WhatsApp webhook (300 req/min per IP - higher for burst)
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=300r/m;

    # Zone 3: n8n UI login (10 req/min per IP - bruteforce protection)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # Zone 4: Grafana dashboard (30 req/min per IP)
    limit_req_zone $binary_remote_addr zone=grafana_limit:10m rate=30r/m;

    # Connection limiting (max 10 concurrent connections per IP)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==============================================================================
    # SECURITY HEADERS (Applied globally)
    # ==============================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ==============================================================================
    # UPSTREAM DEFINITIONS
    # ==============================================================================
    upstream openwa_backend {
        server openwa:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream n8n_backend {
        server n8n:5678 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream grafana_backend {
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    upstream prometheus_backend {
        server prometheus:9090 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # ==============================================================================
    # HTTP → HTTPS REDIRECT
    # ==============================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health check endpoint (no redirect)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================================
    # INCLUDE VHOSTS
    # ==============================================================================
    include /etc/nginx/conf.d/*.conf;
}
