# ==============================================================================
# POSTGRESQL 16 PRODUCTION CONFIG - AAA GRADE
# ==============================================================================
# Target: 1000 TPS | <50ms p99 query latency | WAL archiving enabled
# Hardware: 8GB RAM total, 1GB allocated to Postgres
# ==============================================================================

# ------------------------------------------------------------------------------
# CONNECTION SETTINGS
# ------------------------------------------------------------------------------
max_connections = 100
superuser_reserved_connections = 3

# ------------------------------------------------------------------------------
# MEMORY SETTINGS (Conservative for 1GB allocation)
# ------------------------------------------------------------------------------
shared_buffers = 256MB                  # 25% of allocated RAM
effective_cache_size = 768MB            # 75% of allocated RAM
work_mem = 2MB                          # Per-operation memory
maintenance_work_mem = 64MB             # For VACUUM, CREATE INDEX
temp_buffers = 8MB

# ------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL) - CRITICAL FOR PITR
# ------------------------------------------------------------------------------
wal_level = replica
wal_compression = on
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_warning = 30s

# Archive WAL to S3 (handled by backup agent)
archive_mode = on
archive_command = '/bin/true'           # Override in production with S3 upload
archive_timeout = 3600                  # Force archive every hour

# ------------------------------------------------------------------------------
# QUERY PLANNER
# ------------------------------------------------------------------------------
random_page_cost = 1.1                  # SSD-optimized (default 4.0 for HDD)
effective_io_concurrency = 200          # SSD parallelism
default_statistics_target = 100

# ------------------------------------------------------------------------------
# AUTOVACUUM (Critical for performance)
# ------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 200

# ------------------------------------------------------------------------------
# LOGGING (JSON format for Loki)
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off

log_min_duration_statement = 500ms      # Log slow queries
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'America/Sao_Paulo'

log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0

# ------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# ------------------------------------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'America/Sao_Paulo'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ------------------------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------------------------
ssl = off                               # Handled by internal network
password_encryption = scram-sha-256

# ------------------------------------------------------------------------------
# PERFORMANCE MONITORING
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_activity_query_size = 2048
track_io_timing = on

# ------------------------------------------------------------------------------
# REPLICATION (Future multi-region support)
# ------------------------------------------------------------------------------
max_wal_senders = 3
wal_keep_size = 1GB
hot_standby = on
hot_standby_feedback = on

# ------------------------------------------------------------------------------
# RESOURCE LIMITS (Prevent runaway queries)
# ------------------------------------------------------------------------------
statement_timeout = 30000               # 30s max query time
lock_timeout = 10000                    # 10s max lock wait
idle_in_transaction_session_timeout = 60000  # 60s idle tx timeout
