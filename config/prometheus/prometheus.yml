# ==============================================================================
# PROMETHEUS CONFIG - AAA GRADE MONITORING
# ==============================================================================
# Target: 99.97% uptime visibility | MTTR ≤10min | RTO ≤12min
# Metrics retention: 30 days | Alert latency: <30s
# ==============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openwa-prod'
    environment: 'production'
    region: 'sa-east-1'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Load alerting rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:

  # ==============================================================================
  # INFRASTRUCTURE METRICS
  # ==============================================================================
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - node_exporter:9100
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vps-prod-01'

  - job_name: 'postgres'
    static_configs:
      - targets:
          - postgres_exporter:9187
    metric_relabel_configs:
      - source_labels: [datname]
        regex: 'template.*|postgres'
        action: drop

  - job_name: 'redis'
    static_configs:
      - targets:
          - redis_exporter:9121

  # ==============================================================================
  # APPLICATION METRICS
  # ==============================================================================
  - job_name: 'openwa'
    static_configs:
      - targets:
          - openwa:9090
    scrape_interval: 10s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'openwa'

  - job_name: 'n8n'
    static_configs:
      - targets:
          - n8n:5678
    scrape_interval: 15s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'n8n'

  # ==============================================================================
  # MONITORING STACK SELF-MONITORING
  # ==============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090

  - job_name: 'grafana'
    static_configs:
      - targets:
          - grafana:3000
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'loki'
    static_configs:
      - targets:
          - loki:3100
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - alertmanager:9093
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ==============================================================================
  # BLACKBOX EXPORTER (External Health Checks)
  # ==============================================================================
