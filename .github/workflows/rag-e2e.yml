name: RAG E2E Tests
# Workflow validation: 2026-08-26 (Gap 2 closure)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/modules/knowledge/**'
      - 'src/modules/llm/**'
      - 'test/rag-*.e2e-spec.ts'
      - 'test/fixtures/rag-*.json'
      - 'database/tests/validate_rag_retrieval.py'
      - 'database/tests/fixtures/seed_test_faq.sql'
      - '.github/workflows/rag-e2e.yml'
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  rag-e2e:
    name: RAG E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openwa
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: openwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openwa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            database/tests/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install psycopg2-binary numpy

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U openwa; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Create pgvector extension
        run: |
          PGPASSWORD=test_password psql -h localhost -U openwa -d openwa -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: bash database/scripts/run_migrations_v2.sh
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: openwa
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: openwa

      - name: Seed test fixtures
        run: |
          PGPASSWORD=test_password psql -h localhost -U openwa -d openwa -f database/tests/fixtures/seed_test_faq.sql

      - name: Run RAG E2E tests
        run: npm run test:e2e:rag
        env:
          NODE_ENV: test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: openwa
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: openwa
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Python RAG metrics
        run: python3 database/tests/validate_rag_retrieval.py
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: openwa
          PGPASSWORD: test_password
          PGDATABASE: openwa

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: rag-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7
