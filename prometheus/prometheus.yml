global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Node Exporter - System metrics
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['openwa-node-exporter:9100']

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['openwa-postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['openwa-redis-exporter:9121']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['openwa-grafana:3000']
    metrics_path: '/metrics'

  # OpenWA API - Native endpoint
  - job_name: 'openwa-api'
    static_configs:
      - targets: ['openwa-api:2785']
    metrics_path: '/api/api/metrics'
