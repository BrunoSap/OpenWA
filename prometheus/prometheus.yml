global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'openwa-api'
    static_configs:
      - targets: ['openwa-api:2785']
    metrics_path: '/metrics'
