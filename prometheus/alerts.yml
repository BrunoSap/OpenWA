groups:
  - name: openwa_business_kpis
    interval: 60s
    rules:
      # Alert: High Fallback Rate
      # Triggers when fallback rate exceeds 15% for 10 minutes
      - alert: HighFallbackRate
        expr: |
          (
            sum(rate(analytics_fallbacks_triggered_total[5m]))
            /
            sum(rate(analytics_messages_processed_total[5m]))
          ) > 0.15
        for: 10m
        labels:
          severity: warning
          component: analytics
        annotations:
          summary: "High fallback rate detected"
          description: "Fallback rate is {{ $value | humanizePercentage }} (threshold 15%)"

      # Alert: Low Resolution Rate
      # Triggers when resolution rate drops below 70% for 30 minutes
      - alert: LowResolutionRate
        expr: |
          (
            sum(rate(analytics_conversations_resolved_total[1h]))
            /
            sum(rate(analytics_conversations_started_total[1h]))
          ) < 0.70
        for: 30m
        labels:
          severity: warning
          component: analytics
        annotations:
          summary: "Low resolution rate detected"
          description: "Resolution rate is {{ $value | humanizePercentage }} (threshold 70%)"

      # Alert: High Latency
      # Triggers when p95 latency exceeds 5000ms for 10 minutes
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(analytics_message_latency_bucket[5m])) by (le)
          ) > 5000
        for: 10m
        labels:
          severity: warning
          component: analytics
        annotations:
          summary: "High message latency detected"
          description: "p95 latency is {{ $value }}ms (threshold 5000ms)"

      # Alert: Cost Budget Exceeded
      # Triggers when daily cost increase exceeds $50
      - alert: CostBudgetExceeded
        expr: |
          increase(analytics_cost_total_usd[1d]) > 50
        labels:
          severity: critical
          component: analytics
        annotations:
          summary: "Daily cost budget exceeded"
          description: "Daily cost increase is ${{ $value }} (budget $50)"
