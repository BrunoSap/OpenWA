version: '3.9'

# ==============================================================================
# PRODUCTION DOCKER COMPOSE - AAA GRADE
# ==============================================================================
# Target: Single VPS 8GB RAM (Contabo/Hetzner BR)
# SLA: 99.97% uptime | p95 latency ≤900ms | MTTR ≤10min
# Architecture: OpenWA + n8n + Redis + PostgreSQL + Monitoring Stack
# ==============================================================================

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/postgres
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/redis
      o: bind
  n8n_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/n8n
      o: bind
  openwa_sessions:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/openwa/sessions
      o: bind
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/prometheus
      o: bind
  grafana_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/grafana
      o: bind
  loki_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/openwa/data/loki
      o: bind
  nginx_cache:
    driver: local

services:

  # ============================================================================
  # REVERSE PROXY + RATE LIMITING
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: openwa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
    networks:
      - frontend
      - monitoring
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"

  # ============================================================================
  # OPENWA - WhatsApp Automation (Single Instance)
  # ============================================================================
  openwa:
    build:
      context: ./services/openwa
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20-alpine
    container_name: openwa_instance
    restart: unless-stopped
    networks:
      - frontend
      - backend
      - monitoring
    volumes:
      - openwa_sessions:/app/sessions
      - ./logs/openwa:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - WA_SESSION_NAME=${WA_SESSION_NAME:-default}
      - WA_HEADLESS=${WA_HEADLESS:-true}
      - WA_USE_CHROME=${WA_USE_CHROME:-true}
      - WA_DISABLE_WEBRTC=${WA_DISABLE_WEBRTC:-true}
      - WA_DISABLE_MEDIA_DOWNLOAD=${WA_DISABLE_MEDIA_DOWNLOAD:-false}
      - WA_LOG_LEVEL=${WA_LOG_LEVEL:-info}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/whatsapp
      - METRICS_PORT=9090
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,environment"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ============================================================================
  # N8N - Workflow Orchestration (2 Workers)
  # ============================================================================
  n8n:
    image: n8nio/n8n:1.60.0
    container_name: openwa_n8n_main
    restart: unless-stopped
    networks:
      - frontend
      - backend
      - monitoring
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./logs/n8n:/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-n8n.yourdomain.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB_N8N:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER_N8N}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD_N8N}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_BULL_REDIS_DB=1
      - EXECUTIONS_PROCESS=main
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=file
      - N8N_LOG_FILE_LOCATION=/logs
      # LLM Router Configuration
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PRIMARY_PROVIDER=groq
      - LLM_FALLBACK_PROVIDER=openai
      - LLM_PRIMARY_MODEL=llama-3.3-70b-versatile
      - LLM_FALLBACK_MODEL=gpt-4o-mini
      - LLM_TIMEOUT_MS=5000
      - LLM_MAX_RETRIES=2
      # Groq Whisper STT
      - STT_PROVIDER=groq
      - STT_MODEL=whisper-large-v3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,environment"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  n8n_worker_1:
    image: n8nio/n8n:1.60.0
    container_name: openwa_n8n_worker_1
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    volumes:
      - n8n_data:/home/node/.n8n:ro
      - ./logs/n8n:/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_BULL_REDIS_DB=1
      - EXECUTIONS_PROCESS=worker
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=file
      - N8N_LOG_FILE_LOCATION=/logs
      # Inherit LLM config from main
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PRIMARY_PROVIDER=groq
      - LLM_FALLBACK_PROVIDER=openai
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "pgrep", "-f", "n8n"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        labels: "service,environment"
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  n8n_worker_2:
    image: n8nio/n8n:1.60.0
    container_name: openwa_n8n_worker_2
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    volumes:
      - n8n_data:/home/node/.n8n:ro
      - ./logs/n8n:/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_BULL_REDIS_DB=1
      - EXECUTIONS_PROCESS=worker
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=file
      - N8N_LOG_FILE_LOCATION=/logs
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PRIMARY_PROVIDER=groq
      - LLM_FALLBACK_PROVIDER=openai
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "pgrep", "-f", "n8n"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        labels: "service,environment"
    depends_on:
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  # ============================================================================
  # REDIS - Cache + Sessions + Queue
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: openwa_redis
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"

  # ============================================================================
  # POSTGRESQL - Primary Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: openwa_postgres
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups/postgres:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-openwa}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=America/Sao_Paulo
      # WAL archiving for PITR
      - POSTGRES_INITDB_ARGS=--data-checksums
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openwa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"
        labels: "service,environment"

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: openwa_prometheus
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts:/etc/prometheus/alerts:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"

  # ============================================================================
  # LOKI - Log Aggregation
  # ============================================================================
  loki:
    image: grafana/loki:2.9.3
    container_name: openwa_loki
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - loki_data:/loki
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"

  # ============================================================================
  # PROMTAIL - Log Shipper to Loki
  # ============================================================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: openwa_promtail
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./logs:/logs:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        labels: "service,environment"
    depends_on:
      loki:
        condition: service_healthy

  # ============================================================================
  # GRAFANA - Monitoring Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: openwa_grafana
    restart: unless-stopped
    networks:
      - monitoring
      - frontend
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOST:-grafana.yourdomain.com}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=
      - GF_LOG_MODE=console file
      - GF_LOG_LEVEL=info
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ============================================================================
  # NODE EXPORTER - Host Metrics
  # ============================================================================
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: openwa_node_exporter
    restart: unless-stopped
    networks:
      - monitoring
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service,environment"

  # ============================================================================
  # POSTGRES EXPORTER - Database Metrics
  # ============================================================================
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: openwa_postgres_exporter
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwa}?sslmode=disable
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=true
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service,environment"
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # REDIS EXPORTER - Cache Metrics
  # ============================================================================
  redis_exporter:
    image: oliver006/redis_exporter:v1.55.0-alpine
    container_name: openwa_redis_exporter
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service,environment"
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================================
  # ALERTMANAGER - Alert Routing
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: openwa_alertmanager
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${ALERTMANAGER_HOST:-alerts.yourdomain.com}'
    environment:
      - TZ=America/Sao_Paulo
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID}
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service,environment"
    depends_on:
      prometheus:
        condition: service_healthy

  # ============================================================================
  # BACKUP AGENT - Automated S3 Backups
  # ============================================================================
  backup_agent:
    build:
      context: ./services/backup-agent
      dockerfile: Dockerfile
    container_name: openwa_backup_agent
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - postgres_data:/data/postgres:ro
      - redis_data:/data/redis:ro
      - n8n_data:/data/n8n:ro
      - openwa_sessions:/data/openwa:ro
      - ./backups:/backups
      - ./config/backup/backup.sh:/app/backup.sh:ro
    environment:
      - TZ=America/Sao_Paulo
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=sa-east-1
      - S3_BUCKET=${S3_BACKUP_BUCKET}
      - BACKUP_SCHEDULE=0 */6 * * *
      - BACKUP_RETENTION_DAYS=7
      - MONTHLY_SNAPSHOT_DAY=1
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-openwa}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
