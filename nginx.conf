events {
    worker_connections 1024;
}

http {
    upstream openwa_backend {
        ip_hash;  # Sticky sessions via client IP
        server openwa-api-1:2785 max_fails=3 fail_timeout=30s;
        server openwa-api-2:2785 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # Proxy requests to backend with sticky sessions
        location / {
            proxy_pass http://openwa_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Add custom header to identify which replica handled the request
            add_header X-Replica $upstream_addr always;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health checks — allow failover to healthy replicas
        location /api/health {
            proxy_pass http://openwa_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Failover on 503 or connection errors
            proxy_next_upstream error timeout http_503;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
        }
    }
}
